<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS operator view</title>
<style>
  :root {
    --bg: #0b0e11;
    --card: #14181d;
    --border: #232830;
    --text: #e7e9ea;
    --text-dim: #8b92a0;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, sans-serif;
    --ok: #3dd68c;
    --warn: #f2b84b;
    --crit: #f2545b;
    --neutral: #6b7280;
    --btn-bg: #232830;
    --btn-hover: #2e3540;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 15px; margin: 0; color: var(--text-dim); }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 12px; }
  
  .header-box { display: flex; justify-content: space-between; border: 1px solid var(--border); padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-family: var(--mono); font-size: 14px; background: var(--card); }
  .status-text { font-weight: 600; }
  .status-text.ok { color: var(--ok); }
  .status-text.warn { color: var(--warn); }
  .status-text.crit { color: var(--crit); }
  
  .incident-box { border: 1px solid var(--crit); border-radius: 6px; padding: 16px; margin-bottom: 20px; background: rgba(242, 84, 91, 0.05); }
  .incident-box h2 { color: var(--crit); font-family: var(--sans); font-size: 16px; margin-bottom: 8px; }
  .incident-box p { margin: 4px 0; font-family: var(--mono); font-size: 14px; }
  
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .box { border: 1px solid var(--border); border-radius: 6px; padding: 16px; background: var(--card); }
  
  .stat { font-family: var(--mono); font-size: 14px; margin-bottom: 8px; display: flex; align-items: baseline;}
  .stat .num { color: var(--text); font-weight: bold; width: 50px; display: inline-block; }
  .stat .lbl { color: var(--text-dim); }
  .stat.alert .lbl, .stat.alert .num { color: var(--warn); }
  
  .comp { font-family: var(--mono); font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .comp .name { color: var(--text); }
  .comp .state { color: var(--text-dim); font-size: 12px; }
  .comp.restarting .name { color: var(--warn); }
  .comp.dead .name { color: var(--crit); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .dot.running { background: var(--ok); }
  .dot.restarting { background: var(--warn); }
  .dot.dead { background: var(--crit); }
  .dot.starting { background: var(--neutral); }

  .timeline { font-family: var(--mono); font-size: 13px; line-height: 1.6; max-height: 250px; overflow-y: auto;}
  .timeline-event { display: flex; gap: 12px; margin-bottom: 4px; }
  .timeline-event .ts { color: var(--text-dim); min-width: 70px; }
  .timeline-event .desc { color: var(--text); }
  .why { color: var(--text-dim); font-size: 12px; display: block; margin-left: 82px; margin-bottom: 8px; }
  
  .release-info { font-family: var(--mono); font-size: 14px; }
  .release-info div { margin-bottom: 8px; }
  
  .cache-box { border-left: 4px solid var(--warn); }
  
  button {
    background: var(--btn-bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 4px; font-family: var(--mono); font-size: 12px;
    cursor: pointer; text-transform: uppercase; margin-right: 8px; margin-bottom: 8px;
  }
  button:hover { background: var(--btn-hover); }
  
  .dead-letter-item { font-family: var(--mono); font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .dead-letter-item:last-child { border-bottom: none; }
</style>
</head>
<body>
  <div class="header-box">
    <div>NEXUS <span id="platform-health" class="status-text ok">🟢 HEALTHY</span></div>
    <div style="color: var(--text-dim);">Last checked: <span id="last-checked">0s</span> ago</div>
  </div>

  <div id="incident-container"></div>

  <div class="grid">
    <div class="box">
      <h2>WORK</h2>
      <div id="work-stats"></div>
    </div>
    <div class="box">
      <h2>COMPONENTS</h2>
      <div id="components-list"></div>
    </div>
  </div>

  <div class="box" style="margin-bottom: 20px;">
    <h2>TIMELINE</h2>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="grid">
    <div class="box">
      <h2>RELEASE</h2>
      <div class="release-info" id="release-info">No active release.</div>
    </div>
    
    <div class="box cache-box" id="cache-box" style="display:none;">
      <h2>CACHE DISAGREEMENT</h2>
      <div class="release-info" id="cache-info"></div>
    </div>
  </div>

  <div class="box" id="dead-letter-box" style="margin-bottom: 20px; display: none;">
    <h2>DEAD LETTER</h2>
    <div id="dead-letters-list"></div>
  </div>

  <div class="box" style="border-color: rgba(242, 184, 75, 0.5);">
    <h2 style="color: var(--warn);">⚠ DEMO CONTROLS</h2>
    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px; font-family: var(--sans);">These intentionally break the system.</div>
    
    <div style="margin-bottom: 8px;"><span style="color:var(--text-dim); font-size: 12px; display:inline-block; width:60px;">Worker</span>
      <button onclick="post('/chaos/kill-worker/w-1')">Kill Worker 1</button>
      <button onclick="post('/chaos/crash-loop/w-2')">Crash Loop Worker 2</button>
      <button onclick="post('/chaos/revive/w-2')">Revive Worker 2</button>
    </div>
    <div style="margin-bottom: 8px;"><span style="color:var(--text-dim); font-size: 12px; display:inline-block; width:60px;">Work</span>
      <button onclick="post('/work', {id: 'd-1', type: 'email', body: 'dup', idempotency_token: 'd-tok'})">Post Duplicate Work</button>
      <button onclick="post('/chaos/fail-work/w-3')">Fail Work on Worker 3</button>
    </div>
    <div style="margin-bottom: 8px;"><span style="color:var(--text-dim); font-size: 12px; display:inline-block; width:60px;">Release</span>
      <button onclick="pushRelease()">Push new release</button>
    </div>
    <div><span style="color:var(--text-dim); font-size: 12px; display:inline-block; width:60px;">System</span>
      <button onclick="post('/chaos/dependency-down')">Toggle Dependency Down</button>
      <button onclick="post('/chaos/cause-drift')">Cause Cache Drift</button>
    </div>
  </div>

<script>
let lastFetchTime = Date.now();
let releaseCounter = 5;

function timeAgo(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h';
}
function tOnly(iso) {
  return new Date(iso).toLocaleTimeString('en-GB', { hour12: false });
}

async function post(url, body) {
  try {
    await fetch(url, { method: 'POST', body: body ? JSON.stringify(body) : null });
    poll(); // force instant refresh
  } catch(e) { console.error(e); }
}

function pushRelease() {
  const prev = "v" + (releaseCounter - 1) + ".0";
  const next = "v" + releaseCounter + ".0";
  post('/releases', {id: next, version: next, previous_version: prev});
  releaseCounter++;
}

function render(data) {
  lastFetchTime = Date.now();
  
  // Header
  const ph = document.getElementById('platform-health');
  if (data.platform_healthy) {
    ph.className = 'status-text ok';
    ph.innerHTML = '🟢 HEALTHY';
  } else {
    ph.className = 'status-text crit';
    ph.innerHTML = '🔴 DEGRADED <span style="font-size:12px; font-weight:normal; margin-left:8px;">(dependency offline)</span>';
  }

  const inc = document.getElementById('incident-container');
  if (data.diagnosis && data.diagnosis.text && data.diagnosis.text.indexOf('No anomalous') === -1) {
    let relatedHTML = '';
    if (data.diagnosis.related_release_id) {
      relatedHTML = `
        <div style="margin-top: 16px; padding-top: 12px;">
          <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">Likely related change</div>
          <div style="display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; background: var(--bg);">
            <div style="font-family: var(--mono); font-size: 13px; color: var(--text);">Release ${data.diagnosis.related_release_id}</div>
            <div>
              <button style="margin: 0; margin-right: 8px;" onclick="alert('View release details')">View release</button>
              <button class="btn-danger" style="margin: 0;" onclick="post('/releases/${data.diagnosis.related_release_id}/rollback')">ROLLBACK</button>
            </div>
          </div>
        </div>
      `;
    }

    // In DashboardStatus, Since is formatted as 15:04:05, but timeAgo expects ISO.
    // The previous implementation used "Started 2m ago" but data.diagnosis.since is "10:15:00".
    // We can just say "Started at " + data.diagnosis.since
    inc.innerHTML = `
      <div class="incident-box">
        <h2>🔴 INCIDENT / DIAGNOSIS</h2>
        <div style="color: var(--text); font-family: var(--sans); font-size: 15px; font-weight: 500;">Worker ${data.diagnosis.worker_id} is ${data.diagnosis.action}</div>
        <div style="color: var(--text-dim); font-size: 13px; margin-top: 4px;">Started at ${data.diagnosis.since}</div>
        ${relatedHTML}
      </div>
    `;
  } else {
    inc.innerHTML = '';
  }

  // Work
  const ws = document.getElementById('work-stats');
  let pendingCls = data.backlog.pending > 100 ? 'alert' : '';
  ws.innerHTML = `
    <div class="stat ${pendingCls}"><span class="num">${data.backlog.pending}</span> <span class="lbl">waiting</span></div>
    <div class="stat"><span class="num">${data.backlog.oldest_age_seconds != null ? data.backlog.oldest_age_seconds + 's' : '-'}</span> <span class="lbl">oldest</span></div>
    <div class="stat"><span class="num" style="color:var(--warn);">${data.backlog.dead_letter_count}</span> <span class="lbl">dead letter</span></div>
  `;

  // Components
  const cl = document.getElementById('components-list');
  cl.innerHTML = (data.workers || []).map(w => {
    let lbl = 'RUNNING';
    if (w.status === 'restarting') lbl = 'RESTARTING';
    if (w.status === 'dead') lbl = 'OUT OF SERVICE';
    return `
      <div class="comp ${w.status}">
        <div><span class="dot ${w.status}"></span> <span class="name">${w.id}</span></div>
        <div class="state">${lbl} &nbsp; ${w.restart_count}/5 attempts</div>
      </div>
    `;
  }).join('');

  // Release
  const ri = document.getElementById('release-info');
  if (data.active_release) {
    let r = data.active_release;
    ri.innerHTML = `
      <div>${r.version} &middot; <span style="color:var(--text-dim);">${r.status.toUpperCase()}</span></div>
      <div style="color:var(--text-dim); font-size:12px;">previous: ${r.previous_version}</div>
      <div style="margin-top: 12px;">
        <button onclick="post('/releases/${r.id}/rollback')">ROLLBACK TO ${r.previous_version}</button>
      </div>
    `;
  } else {
    ri.innerHTML = 'No active release.';
  }

  // Dead Letter
  const dl = document.getElementById('dead-letter-box');
  if (data.dead_letters && data.dead_letters.length > 0) {
    dl.style.display = 'block';
    const dlList = document.getElementById('dead-letters-list');
    dlList.innerHTML = data.dead_letters.map(d => `
      <div class="dead-letter-item">
        <div>
          <span style="color:var(--crit);">${d.id}</span> &middot; ${d.type} <br>
          <span style="color:var(--text-dim); font-size: 11px;">failed: ${d.reason} (${timeAgo(d.since)} ago)</span>
        </div>
        <button onclick="post('/work/${d.id}/replay')">Replay</button>
      </div>
    `).join('');
  } else {
    dl.style.display = 'none';
  }

  // Timeline
  const tl = document.getElementById('timeline');
  let timelineHTML = '';
  const events = data.recent_events || [];
  for (let i = 0; i < events.length; i++) {
    const e = events[i];
    let desc = `${e.entity_type} ${e.entity_id} \u2192 ${e.action}`;
    if (e.entity_type === 'release' && e.action === 'pushed') desc = `RELEASE ${e.entity_id}`;
    if (e.entity_type === 'worker' && e.action === 'killed') desc = `${e.entity_id} crashed`;
    if (e.entity_type === 'worker' && e.action === 'panicked') desc = `${e.entity_id} crash loop detected`;
    
    let why = '';
    if (e.reason) why = `<div class="why">Why: ${e.reason}</div>`;
    
    timelineHTML += `
      <div class="timeline-event">
        <span class="ts">${tOnly(e.ts)}</span>
        <span class="desc">${desc}</span>
      </div>
      ${why}
    `;

    if (i < events.length - 1) {
      let isSolid = (e.caused_by_event_id != null);
      let lineChar = isSolid ? '│' : '⋮';
      timelineHTML += `<div style="margin-left: 20px; color: var(--text-dim); font-size: 14px; margin-bottom: 4px;">${lineChar}</div>`;
    }
  }
  tl.innerHTML = timelineHTML || '<div style="color:var(--text-dim);">No recent events</div>';

  // Cache Drift
  const drift = (data.recent_events || []).find(e => e.entity_type === 'cache' && e.action === 'disagreement');
  const cb = document.getElementById('cache-box');
  if (drift) {
    cb.style.display = 'block';
    document.getElementById('cache-info').innerHTML = `
      <div style="color:var(--text); font-family: var(--mono);">${drift.entity_id} <span style="color:var(--warn); font-size:12px; margin-left:8px; font-family:var(--sans);">⚠ DRIFT</span></div>
      <div style="color:var(--text-dim); font-size:12px; margin-top:8px;">${drift.reason}</div>
      <div style="color:var(--crit); font-size:12px; margin-top:8px;">Cached value will not be served.</div>
    `;
  } else {
    cb.style.display = 'none';
  }
}

async function poll() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('platform-health').innerHTML = '🔴 OFFLINE';
    document.getElementById('platform-health').className = 'status-text crit';
  }
}

setInterval(() => {
  document.getElementById('last-checked').innerText = Math.floor((Date.now() - lastFetchTime)/1000) + 's';
}, 1000);

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
